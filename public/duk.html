<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar Urut Kepangkatan (DUK)">
  <title>Daftar Urut Kepangkatan (DUK)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #123b67;
      color: white;
      padding: 18px 24px;
    }
    .header-inner {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
    }
    .back {
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 8px;
    }
    main {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }
    .title {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    .title p {
      margin: 0;
      color: #64748b;
    }
    .sheet {
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 230px);
      min-height: 650px;
      border: 0;
    }
    .notice {
      margin-top: 15px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">Website Kepegawaian</div>
      <a class="back" href="index.html">← Kembali ke Beranda</a>
    </div>
  </header>

  <main>
    <section class="title">
      <h1>DAFTAR URUT KEPANGKATAN (DUK)</h1>
      <p>Tabel DUK ditampilkan langsung dari Google Sheets.</p>
    </section>

    <section class="sheet">
      <iframe
        src="https://docs.google.com/spreadsheets/d/1XnYOJeYaA2O5eQEli3tSc2nnr5SPo4yf6PP1X-BtFCE/edit?gid=1743467230#gid=1743467230"
        title="Tabel Lengkap Daftar Urut Kepangkatan (DUK)"
        loading="lazy">
      </iframe>
    </section>

    <p class="notice">
      Jika tabel tidak tampil, pastikan file Google Sheets sudah dibagikan
      agar dapat dilihat oleh pengunjung website.
    </p>
  </main>
</body>
</html>
